<!doctype html>
<html lang="hi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#071c36">
    <title>TheMorningExpress · Offline</title>
    <style>
      html { color-scheme: light dark; }
      body { margin: 0; background: light-dark(#fff8f1, #171321); color: light-dark(#15182a, #f6edf3); font: 18px/1.8 system-ui, sans-serif; min-height: 100svh; display: grid; place-items: center; }
      main { width: min(36rem, calc(100% - 3rem)); padding: 3rem 0; }
      .masthead { display: block; width: min(100%, 350px); height: auto; }
      @media (prefers-color-scheme: dark) {
        .masthead { filter: invert(1); }
      }
      h1 { font-size: clamp(1.6rem, 5vw, 2.5rem); line-height: 1.5; margin: 1rem 0; }
      p { color: light-dark(#645861, #c8bbcc); }
      a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; background: #54245c; color: #fff; text-decoration: none; border-radius: 4px; border-bottom: 3px solid #ffc47c; }
      a:focus-visible { outline: 3px solid light-dark(#8b2c79, #ffc47c); outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img class="masthead" src="/brand/the-morning-express-hindi.png" width="1554" height="462" alt="द मॉर्निंग एक्सप्रेस">
      <h1>अभी इंटरनेट उपलब्ध नहीं है।</h1>
      <p>नई खबरें पढ़ने के लिए कनेक्शन जुड़ने पर फिर कोशिश करें। आपके खाते और न्यूज़रूम की निजी जानकारी इस डिवाइस पर ऑफलाइन सहेजी नहीं जाती।</p>
      <a href="/">फिर कोशिश करें</a>
    </main>
  </body>
</html>
