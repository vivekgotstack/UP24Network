name: up24network

services:
  redis:
    image: redis:8.4.8-alpine
    user: redis
    command: [redis-server, /run/secrets/redis.conf]
    restart: unless-stopped
    secrets: [redis.conf]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [internal]
    mem_limit: 128m
    pids_limit: 40
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(sed -n "s/^requirepass //p" /run/secrets/redis.conf)" redis-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 3s
      retries: 5
    logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }

  rabbitmq:
    image: rabbitmq:4.4.0-alpine
    hostname: up24-rabbitmq
    user: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_CONFIG_FILE: /run/secrets/rabbitmq.conf
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '+S 2:2 +A 4'
    secrets: [rabbitmq.conf]
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    tmpfs: [/tmp:size=32m,mode=1777]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD-SHELL, 'rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms']
      interval: 15s
      timeout: 10s
      start_period: 45s
      retries: 8
    mem_limit: 512m
    pids_limit: 100
    ulimits: { nofile: { soft: 65536, hard: 65536 } }
    stop_grace_period: 40s
    networks: [internal]
    logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: up24network
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=40, -c, default_toast_compression=lz4, -c, log_min_duration_statement=1000]
    secrets: [postgres-password, application-db-password, migration-db-password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d up24network']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    pids_limit: 100
    networks: [internal]
    logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/run/secrets/backend.properties
      SERVER_ADDRESS: 0.0.0.0
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUTPERSHUTDOWNPHASE: 30s
      SERVER_TOMCAT_THREADS_MAX: 50
      SERVER_TOMCAT_THREADS_MINSPARE: 5
      SERVER_TOMCAT_ACCEPTCOUNT: 100
      SERVER_TOMCAT_MAXCONNECTIONS: 1000
      UP24_MEDIA_DIRECTORY: /app/uploads
      UP24_MEDIA_QUOTA_BYTES: ${UP24_MEDIA_QUOTA_BYTES:-1073741824}
      AUTH_COOKIE_SECURE: 'true'
      SERVER_FORWARDHEADERSSTRATEGY: native
      SERVER_TOMCAT_REMOTEIP_REMOTEIPHEADER: x-forwarded-for
      SERVER_TOMCAT_REMOTEIP_PROTOCOLHEADER: x-forwarded-proto
      SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES: '172\.30\.24\.10'
    secrets: [backend.properties, jwt-signing.p12]
    volumes: [uploads:/app/uploads]
    tmpfs: [/tmp:size=64m,mode=1777]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_started, required: false }
    stop_grace_period: 40s
    mem_limit: 1536m
    pids_limit: 150
    networks:
      internal:
      application: { ipv4_address: 172.30.24.20 }
    logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args: { SITE_URL: '${SITE_URL:?Run node scripts/prepare-deployment.mjs first}', NEWS_API_URL: 'http://backend:8080' }
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL:?Set SITE_URL in deployment.env}
      SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
      NEWS_API_URL: http://backend:8080
      MEDIA_CDN_URL: ${MEDIA_CDN_URL:-}
      MEDIA_UPLOAD_ORIGIN: ${MEDIA_UPLOAD_ORIGIN:-}
      UP24_TRUST_PROXY_HEADERS: 'true'
      NODE_OPTIONS: --max-old-space-size=384
      ANDROID_APP_ID: com.up24network.news
      ANDROID_SHA256_CERT_FINGERPRINTS: ${ANDROID_SHA256_CERT_FINGERPRINTS:-}
    volumes: [frontend_cache:/app/.next/cache]
    tmpfs: [/tmp:size=32m,mode=1777]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on: { backend: { condition: service_healthy } }
    stop_grace_period: 20s
    mem_limit: 1g
    pids_limit: 100
    networks:
      application: { ipv4_address: 172.30.24.10 }
      edge:
    logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment: { SITE_HOST: '${SITE_HOST:?Set SITE_HOST in deployment.env}', GOMEMLIMIT: 96MiB }
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: { frontend: { condition: service_healthy } }
    mem_limit: 128m
    pids_limit: 100
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: [/tmp:size=16m,mode=1777]
    networks: [edge]
    logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }

networks:
  internal: { internal: true }
  application:
    ipam:
      config: [{ subnet: 172.30.24.0/24 }]
  edge:
volumes:
  postgres_data:
  uploads:
  frontend_cache:
  caddy_data:
  caddy_config:
  rabbitmq_data:
secrets:
  postgres-password: { file: './.local/deployment/postgres-password' }
  application-db-password: { file: './.local/deployment/application-db-password' }
  migration-db-password: { file: './.local/deployment/migration-db-password' }
  backend.properties: { file: './.local/deployment/backend.properties' }
  jwt-signing.p12: { file: './.local/deployment/jwt-signing.p12' }
  rabbitmq.conf: { file: './.local/deployment/rabbitmq.conf' }
  redis.conf: { file: './.local/deployment/redis.conf' }
