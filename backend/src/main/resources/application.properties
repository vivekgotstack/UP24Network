spring.application.name=up24-news
server.address=127.0.0.1
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.mvc.problemdetails.enabled=true
spring.config.import=optional:file:./.local/application.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:55432/up24network}
spring.datasource.username=${DB_USERNAME:up24}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
up24.automation.scheduling-enabled=true
