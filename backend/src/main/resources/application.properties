spring.application.name=up24-news
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
up24.jobs.transport=${UP24_JOBS_TRANSPORT:local}
up24.jobs.encryption-secret=${JOB_ENCRYPTION_SECRET:${up24.newsroom.otp-secret}}
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:up24}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:up24}
spring.rabbitmq.connection-timeout=3s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.retry.enabled=false
server.address=127.0.0.1
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.redis.enabled=false
spring.data.redis.connect-timeout=250ms
spring.data.redis.timeout=250ms
spring.mvc.problemdetails.enabled=true
spring.config.import=optional:file:./.local/application.properties,optional:file:./.local/providers.properties,optional:file:./.local/mail.properties,optional:file:./.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:55432/up24network}
spring.datasource.username=${DB_USERNAME:up24}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.jdbc.template.query-timeout=10s
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/problem+json,text/plain,text/html,text/css,application/javascript
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
server.tomcat.max-http-form-post-size=64KB
up24.media.directory=${UP24_MEDIA_DIRECTORY:./.local/uploads}
up24.media.quota-bytes=${UP24_MEDIA_QUOTA_BYTES:1073741824}
up24.media.storage=${UP24_MEDIA_STORAGE:local}
up24.media.s3.bucket=${UP24_S3_BUCKET:}
up24.media.s3.region=${AWS_REGION:ap-south-1}
up24.media.s3.prefix=${UP24_S3_PREFIX:up24/published/images/}
up24.media.s3.cdn-url=${UP24_MEDIA_CDN_URL:}
up24.media.s3.access-key-id=${AWS_ACCESS_KEY_ID:}
up24.media.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
up24.media.s3.session-token=${AWS_SESSION_TOKEN:}
spring.flyway.locations=classpath:db/migration,classpath:db/callback
up24.auth.key-store=${AUTH_KEYSTORE:file:./.local/auth-signing.p12}
up24.auth.key-store-password=${AUTH_KEYSTORE_PASSWORD:}
up24.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
up24.auth.issuer=${AUTH_ISSUER:urn:up24network:identity}
up24.auth.audience=up24network-api
up24.automation.scheduling-enabled=true
up24.providers.astrologics.api-key=${ASTROLOGICS_API_KEY:}
up24.newsroom.admin-email=${NEWSROOM_ADMIN_EMAIL:admin@example.invalid}
up24.newsroom.otp-secret=${NEWSROOM_OTP_SECRET:}
up24.providers.brevo.api-key=${BREVO_API_KEY:}
up24.providers.brevo.sender-email=${BREVO_SENDER_EMAIL:}
up24.newsletter.list-id=${NEWSLETTER_LIST_ID:0}
up24.newsletter.doi-template-id=${NEWSLETTER_DOI_TEMPLATE_ID:0}
up24.newsletter.confirmation-url=${NEWSLETTER_CONFIRM_URL:}
up24.newsletter.site-url=${SITE_URL:}
up24.providers.youtube.api-key=${YOUTUBE_API_KEY:}
up24.providers.weatherbit.api-key=${WEATHERBIT_API_KEY:}
