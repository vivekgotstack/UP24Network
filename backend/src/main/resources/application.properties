spring.application.name=up24-news
server.address=127.0.0.1
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.mvc.problemdetails.enabled=true
spring.config.import=optional:file:./.local/application.properties,optional:file:./.local/providers.properties,optional:file:./.local/mail.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:55432/up24network}
spring.datasource.username=${DB_USERNAME:up24}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.locations=classpath:db/migration,classpath:db/callback
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
up24.automation.scheduling-enabled=true
up24.providers.astrologics.api-key=${ASTROLOGICS_API_KEY:}
up24.newsroom.admin-email=${NEWSROOM_ADMIN_EMAIL:vivekni1224@gmail.com}
up24.newsroom.otp-secret=${NEWSROOM_OTP_SECRET:}
up24.providers.brevo.api-key=${BREVO_API_KEY:}
up24.providers.brevo.sender-email=${BREVO_SENDER_EMAIL:}
