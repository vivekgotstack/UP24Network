name: Production stack smoke test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: up24-release-check
      COMPOSE_ENV_FILE: .local/deployment/deployment.env

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate disposable test configuration
        env:
          SITE_URL: https://release-check.example.com
          SITE_INDEXABLE: 'false'
          ADMIN_EMAIL: release-check@example.com
          UP24_MEDIA_STORAGE: local
        run: |
          export ADMIN_PASSWORD="$(node -e 'console.log(require("node:crypto").randomBytes(24).toString("hex"))')"
          node scripts/prepare-deployment.mjs
          node scripts/deployment-doctor.mjs --structure-only
          docker compose --env-file "$COMPOSE_ENV_FILE" config --quiet

      - name: Build and start the production containers
        run: |
          docker compose --env-file "$COMPOSE_ENV_FILE" up -d --build --wait --wait-timeout 240 redis frontend
          docker compose --env-file "$COMPOSE_ENV_FILE" run --rm --no-deps proxy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Check the reader and the private API boundary
        run: |
          docker compose --env-file "$COMPOSE_ENV_FILE" exec -T frontend node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          const request = (url) => fetch(url, { signal: AbortSignal.timeout(15000) });
          const [home, manifest, articles, newsroom, sampleVideo] = await Promise.all([
            request('http://127.0.0.1:3000/'),
            request('http://127.0.0.1:3000/manifest.webmanifest'),
            request('http://backend:8080/api/articles'),
            request('http://backend:8080/api/admin/articles/browse'),
            request('http://127.0.0.1:3000/videos/nature-sample.mp4'),
          ]);
          assert.equal(home.status, 200);
          assert.match(await home.text(), /TheMorningExpress/);
          assert.equal(manifest.status, 200);
          assert.equal((await manifest.json()).name, 'TheMorningExpress');
          assert.equal(articles.status, 200);
          assert.deepEqual(await articles.json(), []);
          assert.ok([401, 403].includes(newsroom.status));
          assert.equal(sampleVideo.status, 404);
          NODE

      - name: Print container logs on failure
        if: failure()
        run: |
          if [ -f "$COMPOSE_ENV_FILE" ]; then
            docker compose --env-file "$COMPOSE_ENV_FILE" logs --no-color --tail=80
          fi

      - name: Remove disposable containers and volumes
        if: always()
        run: |
          if [ -f "$COMPOSE_ENV_FILE" ]; then
            docker compose --env-file "$COMPOSE_ENV_FILE" down -v --remove-orphans
          fi
